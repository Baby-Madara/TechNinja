<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="512" height="512" rx="100" fill="#0f172a"/>
  
  <g transform="translate(256 256)">
      <!-- Gear Ring -->
      <!-- Radius 110, stroke 50 => draws from 85 to 135 -->
      <circle r="110" fill="none" stroke="#3b82f6" stroke-width="50" />
      
      <!-- Teeth -->
      <!-- Rects go from 100 to 160 distance from center -->
      <rect x="-25" y="-160" width="50" height="60" fill="#3b82f6" />
      <rect x="-25" y="100" width="50" height="60" fill="#3b82f6" />
      <rect x="-160" y="-25" width="60" height="50" fill="#3b82f6" />
      <rect x="100" y="-25" width="60" height="50" fill="#3b82f6" />
      
      <!-- Diagonals -->
      <g transform="rotate(45)">
          <rect x="-25" y="-160" width="50" height="60" fill="#3b82f6" />
          <rect x="-25" y="100" width="50" height="60" fill="#3b82f6" />
          <rect x="-160" y="-25" width="60" height="50" fill="#3b82f6" />
          <rect x="100" y="-25" width="60" height="50" fill="#3b82f6" />
      </g>
  </g>

  <!-- Lightning Bolt -->
  <!-- Centered on top -->
  <path d="M276 170 L196 270 L256 270 L236 370 L316 270 L256 270 L276 170 Z" fill="#eab308" stroke="#fef08a" stroke-width="10" stroke-linejoin="round"/>
</svg>
